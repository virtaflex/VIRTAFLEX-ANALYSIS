<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut" />
    <meta name="theme-color" content="#120b0a" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%%OG_IMAGE%" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preload" as="image" type="image/webp" href="/images/photos/hero-1024.webp"
      imagesrcset="/images/photos/hero-640.webp 640w, /images/photos/hero-1024.webp 1024w, /images/photos/hero-1600.webp 1600w"
      imagesizes="(max-width: 900px) 100vw, 62vw" fetchpriority="high" />

    <!--LOCAL_BUSINESS_JSONLD-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif;color:#fff5df;background:#120b0a">Pizza Hub — fresh pizza in Obour City. Please enable JavaScript to order online.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
